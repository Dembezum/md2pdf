<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
    <meta charset="utf-8">
    <title>$if(title)$$title$$else$Document$endif$</title>
    <style>$highlighting-css$</style>
    <style>$md2pdf-css$</style>

</head>
<body data-cover="$if(cover)$yes$else$no$endif$" class="theme-$md2pdf-theme$ pagination-$md2pdf-pagination$">
    $if(cover)$
    <header class="cover">
        <div class="eyebrow">$if(document-type)$$document-type$$else$Technical documentation$endif$</div>
        <div class="cover-title">$title$</div>
        $if(subtitle)$<div class="subtitle">$subtitle$</div>$endif$
        <div class="cover-rule"></div>
        <div class="cover-meta">
            $for(author)$<div>$author$</div>$endfor$
            $if(version)$<div>Version $version$</div>$endif$
            $if(date)$<div>$date$</div>$endif$
        </div>
    </header>
    $endif$
    $if(toc)$
    <nav id="TOC" aria-label="Contents"><div class="toc-title">Contents</div>$table-of-contents$</nav>
    $endif$
    <article class="markdown-body">
        $body$
    </article>
</body>
</html>
